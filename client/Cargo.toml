[package]
name = "client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "terrain_car"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
bevy = { version = "0.19.1", features = ["jpeg"] }
bevy_rapier3d = { version = "0.36.0", features = ["debug-render-3d"] }
noise = "0.9.0"
rand = "0.8"
bevy_replicon = "0.44.0"
bevy_replicon_renet = "0.20.0"
# Only 3d — this is a 3d-only game, and gpu_tests/trace are dev-only.
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }
bevy_egui = "0.42.0"
