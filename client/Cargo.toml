[package]
name = "client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "terrain_car"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
bevy = { version = "0.19.1", features = ["jpeg"] }
bevy_rapier3d = { version = "0.36.0", features = ["debug-render-3d"] }
noise = "0.9.0"
rand = "0.8"
bevy_replicon = "0.44.0"
bevy_replicon_renet = "0.20.0"
